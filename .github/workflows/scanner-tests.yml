name: Scanner regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check script.js
      - run: node --check api/career-analyze.js
